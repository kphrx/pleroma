when:
  - event: push
    branch: stable
    path: [ "*.ex", "*.eex", "*.exs", "mix.lock", ".woodpecker/**" ]
  - event: tag
    branch: stable
  - event: manual
    branch: stable

depends_on:
  - docker-stable

skip_clone: true

steps:
  docker-stable-combine:
    image: git.fluffytail.org/phnt/wpc-docker-tagger:latest
    when:
      - event: push
      - evaluate: 'CI_PIPELINE_EVENT == "manual" && CI_COMMIT_TAG == ""'
    settings: &docker_settings
      registry: "git.fluffytail.org"
      image: "pleroma-test/pleroma"
      architectures: [amd64, arm64]
      tags: &docker_tags
        - latest
        - stable
        - ${CI_COMMIT_SHA}
      username:
        from_secret: pleroma-ci-user
      password:
        from_secret: pleroma-ci-password

  docker-stable-tag-combine:
    image: git.fluffytail.org/phnt/wpc-docker-tagger:latest
    when:
      - event: tag
      - evaluate: 'CI_PIPELINE_EVENT == "manual" && CI_COMMIT_TAG != ""'
    settings:
      <<: *docker_settings
      tags:
        - <<: *docker_tags
        - ${CI_COMMIT_TAG}
